services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cybersage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cybersage}
      POSTGRES_DB: ${POSTGRES_DB:-cybersage}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cybersage} -d ${POSTGRES_DB:-cybersage}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
